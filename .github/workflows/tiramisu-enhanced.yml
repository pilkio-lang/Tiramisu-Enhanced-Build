      - name: Recuperer de la place sur la VM ephemere
        run: |
          set -euo pipefail
          [[ "${GITHUB_ACTIONS:-}" == true && "${RUNNER_OS:-}" == Linux ]]
          df -h /
          # Preinstalled runner tools only. No deletion on the user's PC.
          for p in /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL; do
            if [[ -d "$p" ]]; then sudo rm -rf -- "$p"; fi
          done
          sudo apt-get clean
          df -h /
          available=$(df -Pk "$HOME" | awk 'NR==2 {print $4}')
          echo "Available KiB: $available"
          if (( available < 24*1024*1024 )); then
            echo '::error::Moins de 24 Gio libres apres nettoyage du runner. Un runner plus spacieux sera necessaire.'
            exit 1
          fi
      - name: Compiler tester signer et verifier
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kit"
          mkdir -p Logs
          # Never skip an upstream test; the driver repeats no already passed gate.
          args=()
          if [[ "$MODE" == strict ]]; then args+=(--strict); fi
          bash build.sh "${args[@]}" 2>&1 | tee Logs/cloud-runner.log
      - name: Publier uniquement le MSIX valide et son certificat public
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Tiramisu-Enhanced-r1.7-preview-hotfix1-${{ inputs.mode }}
          path: |
            kit/Output/**/Tiramisu-Enhanced.msix
            kit/Output/**/dev.cer
            kit/Output/**/SHA256SUMS.txt
            kit/Output/**/build-info.txt
            kit/Output/**/enhanced-r1.diff
            kit/Output/**/*.commit
            kit/Output/**/sdk-selection.txt
            kit/Output/**/xwin-version.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Resume automatique du resultat
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          {
            echo '## Tiramisu Enhanced Cloud r1.7-preview-hotfix1'
            echo "Statut : **$BUILD_STATUS**"
            if [[ -f kit/Logs/final-stage.txt ]]; then
              printf 'Derniere phase : '; cat kit/Logs/final-stage.txt
            fi
            if [[ -f kit/Logs/exit-code.txt ]]; then
              printf 'Code de sortie : '; cat kit/Logs/exit-code.txt
            fi
            if [[ -s kit/Logs/toolchain/host-errors.txt ]]; then
              count=$(grep -c 'TRT_COMPILE_FAILED:' kit/Logs/toolchain/host-errors.txt || true)
              echo "Sources en echec signalees : $count"
              echo 'Details dans host-errors.txt et host-build.log.'
            fi
            if [[ "$BUILD_STATUS" == success ]]; then
              echo 'Telecharger le MSIX verifie et dev.cer dans Artifacts.'
            else
              echo 'Telecharger les journaux dans Artifacts ; aucun MSIX non valide publie.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publier les journaux meme en cas d echec
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tiramisu-Enhanced-r1.7-preview-hotfix1-logs
          path: |
            kit/Logs/*.log
            kit/Logs/*.txt
            kit/Logs/toolchain/*.log
            kit/Logs/toolchain/*.txt
            kit/Logs/toolchain/*.commit
          if-no-files-found: warn
          retention-days: 7
