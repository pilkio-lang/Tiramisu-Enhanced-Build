          PAYLOAD
          echo '3a82d5aa2a7cd116f3ebd9111bb6c60686dd2cbaf7e7f4eae25ecff285c37062  kit.zip' | sha256sum -c -
          unzip -q kit.zip
          rm kit.zip
          [[ -f build.sh && -f prepare.py && -d patches && ! -d kit ]] || { echo "Invalid embedded kit layout: expected files directly in kit/" >&2; exit 2; }
