          PAYLOAD
          echo '71d493262078ac1ef0ad99d47a412d6e25fac1dd20f83be296a591c9718e7519  kit.zip' | sha256sum -c -
          unzip -q kit.zip
          rm kit.zip
          for f in *.sh; do bash -n "$f"; done
          python3 test_kit.py
          python3 test_host_prepare.py
          python3 test_launch_r17.py
          # Check the actual pinned sources before downloading/building SDK tools.
          mkdir -p Logs
