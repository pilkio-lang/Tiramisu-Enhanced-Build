          PAYLOAD
          echo 'f125fa343494cc5b1a30618b5dd4bda9d09beb3e0b45240fce1f69d4bcfd651a  kit.zip' | sha256sum -c -
          unzip -q kit.zip
          rm kit.zip
          [[ -f build.sh && -f prepare.py && -d patches && ! -d kit ]] || { echo "Invalid embedded kit layout: expected files directly in kit/" >&2; exit 2; }
