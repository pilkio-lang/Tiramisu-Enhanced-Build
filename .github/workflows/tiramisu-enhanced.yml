# Tiramisu Enhanced Cloud r1.8-preview-user32-pe32-window-batch — manual build, no local SDK.
# The embedded ZIP is the readable kit/ directory in the companion archive.
# Never uploads SDK, private signing keys, or game data.
name: Tiramisu Enhanced - Cloud r1.8-preview-user32-pe32-window-batch
on:
  workflow_dispatch:
    inputs:
      accept_sdk:
        description: "J'accepte les conditions Microsoft SDK/CRT et le telechargement des outils"
        required: true
        type: boolean
        default: false
      mode:
        description: "targeted recommande ; strict pour diagnostic PE32"
        required: true
        type: choice
        options:
          - targeted
          - strict
        default: targeted
permissions:
  contents: read
concurrency:
  group: tiramisu-enhanced-cloud-${{ github.repository }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    env:
      TRT_JOBS: '2'
      TRT_ENHANCED_ROOT: /home/runner/tiramisu-enhanced-r1
    steps:
      - name: Verifier le consentement et preparer les sources
        env:
          ACCEPT_SDK: ${{ inputs.accept_sdk }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/kit/Logs"
          (
          set -Eeuo pipefail
          trap 'rc=$?; echo "Preflight failed: exit=$rc line=$LINENO" >&2' ERR
          [[ "$ACCEPT_SDK" == true ]] || { echo 'Cocher accept_sdk apres lecture des conditions du SDK Microsoft.'; exit 1; }
          [[ "$MODE" == targeted || "$MODE" == strict ]]
          mkdir -p "$GITHUB_WORKSPACE/kit"
          cd "$GITHUB_WORKSPACE/kit"
